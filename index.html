<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>עמדות כיבוי אש — קיבוץ גשר</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --red:#d92b2b; --red-dark:#a81f1f;
    --green:#1a9e4b; --orange:#e28413; --gray:#7a8290;
    --bg:#f2f4f7; --card:#ffffff; --line:#dfe3ea;
    --text:#141a21; --muted:#5d6672;
    --shadow:0 2px 10px rgba(15,25,40,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; overflow:hidden;
  }

  /* ---------- כותרת + סטטיסטיקה ---------- */
  header{
    background:linear-gradient(135deg,var(--red),var(--red-dark));
    color:#fff; padding:10px 14px; box-shadow:var(--shadow); z-index:1000;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  header h1{font-size:19px;margin:0;display:flex;align-items:center;gap:8px;white-space:nowrap}
  header h1 small{font-weight:400;opacity:.85;font-size:12px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-inline-start:auto}
  .stat{
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.25);
    border-radius:9px; padding:4px 10px; min-width:64px; text-align:center;
    cursor:pointer; transition:.15s; line-height:1.15;
  }
  .stat:hover{background:rgba(255,255,255,.28)}
  .stat.on{background:#fff;color:var(--text);border-color:#fff}
  .stat b{display:block;font-size:18px}
  .stat span{font-size:11px;opacity:.9}
  .stat.on span{opacity:.7}

  /* ---------- פריסה ---------- */
  main{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0;background:#2b3440}

  aside{
    width:330px; background:var(--card); border-inline-start:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0; z-index:900;
  }
  .tools{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px}
  input,select,textarea,button{font-family:inherit;font-size:14px}
  input[type=text],input[type=date],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid #b9c6dd;outline-offset:0}
  .btn{
    border:0;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600;
    background:#eef1f6;color:var(--text);transition:.15s;white-space:nowrap;
  }
  .btn:hover{filter:brightness(.95)}
  .btn.primary{background:var(--red);color:#fff}
  .btn.ok{background:var(--green);color:#fff}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .btn.danger{background:#fdeaea;color:var(--red-dark)}
  .btn:disabled{opacity:.5;cursor:default}

  /* ---------- רשימת עמדות ---------- */
  .list{flex:1;overflow:auto;padding:8px}
  .item{
    border:1px solid var(--line);border-inline-start:5px solid var(--c,var(--gray));
    border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;background:#fff;
  }
  .item:hover{background:#f7f9fc}
  .item .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .item .n{font-weight:700;font-size:14px}
  .item .b{font-size:12px;color:var(--muted)}
  .item .d{font-size:12px;font-weight:700;color:var(--c)}
  .empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}

  /* ---------- סמנים במפה ---------- */
  .pin{
    width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid var(--c);
    display:grid;place-items:center;font-size:17px;box-shadow:0 2px 6px rgba(0,0,0,.45);
  }
  .pin.miss{border-style:dashed;background:#eceff3;filter:grayscale(1)}
  .pin.late{animation:beat 1.1s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

  .leaflet-popup-content{margin:10px 12px;direction:rtl;text-align:right;min-width:190px}
  .pop h3{margin:0 0 2px;font-size:15px}
  .pop .sub{color:var(--muted);font-size:12px;margin-bottom:6px}
  .pop dl{margin:0 0 8px;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
  .pop dt{color:var(--muted)}
  .pop dd{margin:0;font-weight:600}
  .pop .acts{display:flex;gap:6px;flex-wrap:wrap}
  .pop .acts .btn{padding:6px 9px;font-size:12px}

  .badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;background:var(--c)}

  /* ---------- מודאל ---------- */
  .modal{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;place-items:center;z-index:5000;padding:14px}
  .modal.open{display:grid}
  .sheet{background:#fff;border-radius:14px;width:min(460px,100%);max-height:92vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .sheet h2{margin:0;padding:14px 16px;background:var(--red);color:#fff;border-radius:14px 14px 0 0;font-size:17px}
  .sheet .body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sheet .foot{display:flex;gap:8px;padding:0 16px 16px}
  .sheet .foot .btn{flex:1}

  .hint{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    background:#141a21;color:#fff;padding:9px 16px;border-radius:22px;font-size:14px;
    z-index:1200;box-shadow:var(--shadow);display:none
  }
  .hint.show{display:block}

  #mobBtn{display:none}

  /* ---------- מובייל ---------- */
  @media(max-width:780px){
    header h1 small{display:none}
    .stats{width:100%;margin:0;justify-content:space-between}
    .stat{flex:1;min-width:0;padding:4px 2px}
    aside{
      position:fixed;inset:auto 0 0 0;height:62vh;width:100%;
      border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);
      transform:translateY(100%);transition:transform .25s;border:0
    }
    aside.open{transform:translateY(0)}
    #mobBtn{
      display:block;position:fixed;bottom:14px;inset-inline-start:14px;z-index:1500;
      border-radius:26px;padding:12px 18px;box-shadow:var(--shadow)
    }
  }

  /* ---------- הדפסה ---------- */
  #printArea{display:none}
  @media print{
    header,aside,#map,.hint,#mobBtn,.leaflet-control-container{display:none!important}
    body{overflow:visible;display:block}
    #printArea{display:block;padding:14px}
    #printArea h2{margin:0 0 10px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border:1px solid #999;padding:5px 6px;text-align:right}
    th{background:#eee}
  }
</style>
</head>
<body>

<header>
  <h1>🧯 עמדות כיבוי אש <small>· קיבוץ גשר · כיתת כוננות</small></h1>
  <div class="stats" id="stats"></div>
</header>

<main>
  <div id="map"></div>
  <div class="hint" id="hint">👆 לחצו על המפה במקום שבו נמצאת העמדה</div>

  <aside id="side">
    <div class="tools">
      <div class="row">
        <button class="btn primary" style="flex:1" id="addBtn">➕ הוספת עמדה</button>
        <button class="btn ghost" id="locBtn" title="המיקום שלי">📍</button>
      </div>
      <input type="text" id="search" placeholder="חיפוש לפי שם / מבנה / הערה…">
      <div class="row">
        <select id="sort">
          <option value="urgent">מיון: הכי דחוף קודם</option>
          <option value="name">מיון: לפי שם</option>
          <option value="building">מיון: לפי מבנה</option>
        </select>
      </div>
      <div class="row">
        <button class="btn ghost" style="flex:1" id="expBtn" title="שמירת גיבוי לקובץ">⬇️ גיבוי</button>
        <button class="btn ghost" style="flex:1" id="impBtn" title="טעינה מקובץ גיבוי">⬆️ טעינה</button>
        <button class="btn ghost" style="flex:1" id="prnBtn" title="הדפסת דוח">🖨️ דוח</button>
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>
</main>

<button class="btn primary" id="mobBtn">📋 רשימת עמדות</button>

<!-- מודאל עריכה -->
<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="mTitle">עמדת כיבוי חדשה</h2>
    <div class="body">
      <div>
        <label>שם / מספר העמדה</label>
        <input type="text" id="f_name" placeholder="למשל: עמדה 3 — כניסה ראשית">
      </div>
      <div>
        <label>מבנה / מיקום</label>
        <input type="text" id="f_building" list="buildings" placeholder="למשל: בית ספר — קומה א'">
        <datalist id="buildings"></datalist>
      </div>
      <div class="grid2">
        <div>
          <label>סוג</label>
          <select id="f_type">
            <option>מטף אבקה 6 ק"ג</option>
            <option>מטף אבקה 12 ק"ג</option>
            <option>מטף CO2</option>
            <option>מטף מים</option>
            <option>גלגלון כיבוי</option>
            <option>ארון כיבוי / הידרנט</option>
            <option>שמיכת אש</option>
            <option>אחר</option>
          </select>
        </div>
        <div>
          <label>מצב</label>
          <select id="f_status">
            <option value="ok">✅ תקין — עבר בדיקה</option>
            <option value="fail">⛔ לא תקין — דורש טיפול</option>
            <option value="missing">⬜ חסר — צריך להתקין</option>
          </select>
        </div>
      </div>
      <div class="grid2">
        <div>
          <label>בדיקה אחרונה</label>
          <input type="date" id="f_last">
        </div>
        <div>
          <label>בדיקה הבאה</label>
          <input type="date" id="f_next">
        </div>
      </div>
      <div>
        <label>הערות</label>
        <textarea id="f_notes" rows="2" placeholder="למשל: חסר שילוט, הגישה חסומה…"></textarea>
      </div>
      <div style="font-size:12px;color:var(--muted)" id="f_coords"></div>
    </div>
    <div class="foot">
      <button class="btn primary" id="saveBtn">שמירה</button>
      <button class="btn ghost" id="cancelBtn">ביטול</button>
      <button class="btn danger" id="delBtn">מחיקה</button>
    </div>
  </div>
</div>

<div id="printArea"></div>
<input type="file" id="fileIn" accept=".json" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================
   עמדות כיבוי אש — קיבוץ גשר
   כל המידע נשמר מקומית בדפדפן (localStorage) + גיבוי לקובץ
   ========================================================= */

const KEY   = 'gesher_fire_v1';
const GESHER = [32.6193, 35.5544];   // מרכז קיבוץ גשר — אומת מול OpenStreetMap

/* ---------- נתונים ---------- */
let stations = [];
try { stations = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ stations = []; }
const save = () => localStorage.setItem(KEY, JSON.stringify(stations));

let filter = 'all', editId = null, placing = false, tmpLatLng = null;

/* ---------- עזרי תאריך ---------- */
const today = () => new Date().toISOString().slice(0,10);
function addYear(d){
  if(!d) return '';
  const x = new Date(d); x.setFullYear(x.getFullYear()+1);
  return x.toISOString().slice(0,10);
}
function daysLeft(d){
  if(!d) return null;
  return Math.round((new Date(d) - new Date(today())) / 86400000);
}
function fmt(d){
  if(!d) return '—';
  const [y,m,dd] = d.split('-');
  return `${dd}/${m}/${y}`;
}

/* ---------- חישוב מצב ---------- */
// missing = אין עמדה | fail = לא תקין | late = פג תוקף | soon = בדיקה בקרוב | ok = תקין
function state(s){
  if(s.status === 'missing') return 'missing';
  if(s.status === 'fail')    return 'fail';
  const n = daysLeft(s.next);
  if(n === null)  return 'soon';
  if(n < 0)       return 'late';
  if(n <= 30)     return 'soon';
  return 'ok';
}
const COLORS = {ok:'#1a9e4b', soon:'#e28413', late:'#d92b2b', fail:'#d92b2b', missing:'#7a8290'};
const NAMES  = {ok:'תקין', soon:'בדיקה קרובה', late:'פג תוקף!', fail:'לא תקין!', missing:'חסר'};
const color  = s => COLORS[state(s)];

/* ---------- מפה ---------- */
const map = L.map('map', {zoomControl:false}).setView(GESHER, 17);
L.control.zoom({position:'topleft'}).addTo(map);

/* מקורות צילום שונים — לכל אחד תאריך צילום אחר מעל גשר.
   אם אחד נראה ישן, מחליפים לאחר בבורר שמימין למעלה. */

// Bing בונה כתובת אריח משיטת "quadkey" ולכן צריך שכבה מותאמת
const Bing = L.TileLayer.extend({
  getTileUrl(c){
    let q = '';
    for(let i = c.z; i > 0; i--){
      let d = 0, m = 1 << (i-1);
      if((c.x & m) !== 0) d += 1;
      if((c.y & m) !== 0) d += 2;
      q += d;
    }
    return `https://ecn.t${Math.abs(c.x) % 4}.tiles.virtualearth.net/tiles/a${q}.jpeg?g=1`;
  }
});

const bases = {
  '🛰️ לוויין (Google)': L.tileLayer('https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
      {subdomains:['0','1','2','3'], maxZoom:21, maxNativeZoom:20, attribution:'תצלום: Google'}),
  '🛰️ לוויין (Bing)': new Bing({maxZoom:21, maxNativeZoom:19, attribution:'תצלום: Microsoft Bing'}),
  '🛰️ לוויין (Esri)': L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {maxZoom:21, maxNativeZoom:19, attribution:'תצלום: Esri'}),
  '🗺️ מפת רחובות': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19, attribution:'© OpenStreetMap'})
};

// זוכרים את המקור שנבחר לפעם הבאה
const savedBase = localStorage.getItem(KEY + '_base');
const firstBase = bases[savedBase] ? savedBase : '🛰️ לוויין (Google)';
bases[firstBase].addTo(map);

L.control.layers(bases, null, {position:'topleft', collapsed:false}).addTo(map);
map.on('baselayerchange', e => localStorage.setItem(KEY + '_base', e.name));

const layer = L.layerGroup().addTo(map);
const markers = {};

/* ---------- ציור סמנים ---------- */
function icon(s){
  const st = state(s);
  const cls = 'pin' + (st==='missing'?' miss':'') + (st==='late'||st==='fail'?' late':'');
  return L.divIcon({
    className:'st-marker',
    html:`<div class="${cls}" style="--c:${COLORS[st]}">${st==='missing'?'❌':'🧯'}</div>`,
    iconSize:[34,34], iconAnchor:[17,17], popupAnchor:[0,-18]
  });
}

function popup(s){
  const st = state(s), n = daysLeft(s.next);
  const when = n===null ? 'לא נקבע'
             : n < 0    ? `באיחור ${Math.abs(n)} ימים`
             : n === 0  ? 'היום!'
             : `בעוד ${n} ימים`;
  return `<div class="pop" style="--c:${COLORS[st]}">
    <h3>${esc(s.name||'עמדה')}</h3>
    <div class="sub">${esc(s.building||'')} <span class="badge">${NAMES[st]}</span></div>
    <dl>
      <dt>סוג</dt><dd>${esc(s.type||'—')}</dd>
      <dt>בדיקה אחרונה</dt><dd>${fmt(s.last)}</dd>
      <dt>בדיקה הבאה</dt><dd>${fmt(s.next)} <span style="color:${COLORS[st]}">(${when})</span></dd>
      ${s.notes?`<dt>הערות</dt><dd>${esc(s.notes)}</dd>`:''}
    </dl>
    <div class="acts">
      <button class="btn ok"    onclick="checkNow('${s.id}')">✔ נבדק היום</button>
      <button class="btn"       onclick="edit('${s.id}')">✏️ עריכה</button>
    </div>
  </div>`;
}
const esc = t => String(t??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function drawMap(){
  layer.clearLayers();
  for(const k in markers) delete markers[k];
  visible().forEach(s=>{
    const m = L.marker([s.lat,s.lng], {icon:icon(s), draggable:true, title:s.name})
      .bindPopup(popup(s))
      .on('dragend', e=>{
        const p = e.target.getLatLng();
        s.lat = p.lat; s.lng = p.lng; save(); render();
      })
      .addTo(layer);
    markers[s.id] = m;
  });
}

/* ---------- סינון ומיון ---------- */
function visible(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let out = stations.filter(s=>{
    if(filter !== 'all'){
      const st = state(s);
      if(filter === 'late'  && !(st==='late' || st==='fail')) return false;
      if(filter === 'soon'  && st!=='soon')    return false;
      if(filter === 'ok'    && st!=='ok')      return false;
      if(filter === 'missing'&& st!=='missing')return false;
    }
    if(q){
      const hay = `${s.name} ${s.building} ${s.type} ${s.notes}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const rank = {late:0, fail:0, missing:1, soon:2, ok:3};
  const by = document.getElementById('sort').value;
  out.sort((a,b)=>{
    if(by==='name')     return (a.name||'').localeCompare(b.name||'','he');
    if(by==='building') return (a.building||'').localeCompare(b.building||'','he');
    const d = rank[state(a)] - rank[state(b)];
    return d !== 0 ? d : (daysLeft(a.next) ?? 9999) - (daysLeft(b.next) ?? 9999);
  });
  return out;
}

/* ---------- ממשק ---------- */
function drawStats(){
  const c = {all:stations.length, ok:0, soon:0, late:0, missing:0};
  stations.forEach(s=>{
    const st = state(s);
    if(st==='late'||st==='fail') c.late++;
    else if(st==='soon') c.soon++;
    else if(st==='ok') c.ok++;
    else c.missing++;
  });
  const defs = [
    ['all','הכל',c.all], ['ok','תקין',c.ok], ['soon','בקרוב',c.soon],
    ['late','פג תוקף',c.late], ['missing','חסר',c.missing]
  ];
  document.getElementById('stats').innerHTML = defs.map(([k,t,v])=>
    `<div class="stat ${filter===k?'on':''}" data-f="${k}"><b>${v}</b><span>${t}</span></div>`).join('');
  document.querySelectorAll('.stat').forEach(el=>
    el.onclick = ()=>{ filter = el.dataset.f; render(); });
}

function drawList(){
  const arr = visible();
  const box = document.getElementById('list');
  if(!stations.length){
    box.innerHTML = `<div class="empty">
      אין עדיין עמדות רשומות.<br><br>
      לוחצים על <b>➕ הוספת עמדה</b>,<br>ואז על המקום במפה שבו נמצאת העמדה.
    </div>`;
    return;
  }
  if(!arr.length){ box.innerHTML = `<div class="empty">אין עמדות שמתאימות לסינון.</div>`; return; }
  box.innerHTML = arr.map(s=>{
    const st = state(s), n = daysLeft(s.next);
    const when = st==='missing' ? 'חסר'
               : n===null ? 'אין תאריך'
               : n<0 ? `${Math.abs(n)} ימי איחור`
               : `עוד ${n} י׳`;
    return `<div class="item" data-id="${s.id}" style="--c:${COLORS[st]}">
      <div class="t"><span class="n">${esc(s.name||'עמדה')}</span><span class="d">${when}</span></div>
      <div class="b">${esc(s.building||'ללא מבנה')} · ${esc(s.type||'')}</div>
    </div>`;
  }).join('');
  box.querySelectorAll('.item').forEach(el=>{
    el.onclick = ()=>{
      const s = stations.find(x=>x.id===el.dataset.id);
      map.flyTo([s.lat,s.lng], 20, {duration:.7});
      markers[s.id]?.openPopup();
      document.getElementById('side').classList.remove('open');
    };
  });
}

function drawBuildings(){
  const set = [...new Set(stations.map(s=>s.building).filter(Boolean))];
  document.getElementById('buildings').innerHTML = set.map(b=>`<option value="${esc(b)}">`).join('');
}

function render(){ drawStats(); drawList(); drawMap(); drawBuildings(); }

/* ---------- הוספה / עריכה ---------- */
document.getElementById('addBtn').onclick = ()=>{
  placing = true;
  document.getElementById('hint').classList.add('show');
  document.getElementById('side').classList.remove('open');
  map.getContainer().style.cursor = 'crosshair';
};

map.on('click', e=>{
  if(!placing) return;
  placing = false;
  document.getElementById('hint').classList.remove('show');
  map.getContainer().style.cursor = '';
  tmpLatLng = e.latlng;
  openForm(null);
});

function openForm(id){
  editId = id;
  const s = id ? stations.find(x=>x.id===id) : null;
  document.getElementById('mTitle').textContent = s ? 'עריכת עמדה' : 'עמדת כיבוי חדשה';
  document.getElementById('f_name').value     = s?.name || '';
  document.getElementById('f_building').value = s?.building || '';
  document.getElementById('f_type').value     = s?.type || 'מטף אבקה 6 ק"ג';
  document.getElementById('f_status').value   = s?.status || 'ok';
  document.getElementById('f_last').value     = s?.last || today();
  document.getElementById('f_next').value     = s?.next || addYear(today());
  document.getElementById('f_notes').value    = s?.notes || '';
  const ll = s ? {lat:s.lat, lng:s.lng} : tmpLatLng;
  document.getElementById('f_coords').textContent =
    `מיקום: ${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)} · אפשר לגרור את הסמן במפה כדי לתקן`;
  document.getElementById('delBtn').style.display = s ? '' : 'none';
  document.getElementById('modal').classList.add('open');
  document.getElementById('f_name').focus();
}
window.edit = openForm;

// עדכון אוטומטי של תאריך הבדיקה הבאה (שנה קדימה)
document.getElementById('f_last').onchange = e=>{
  document.getElementById('f_next').value = addYear(e.target.value);
};

document.getElementById('saveBtn').onclick = ()=>{
  const g = id => document.getElementById(id).value.trim();
  const data = {
    name:g('f_name') || 'עמדה ללא שם',
    building:g('f_building'), type:g('f_type'), status:g('f_status'),
    last:g('f_last'), next:g('f_next'), notes:g('f_notes')
  };
  if(editId){
    Object.assign(stations.find(x=>x.id===editId), data);
  }else{
    stations.push({id:'s'+Date.now()+Math.random().toString(36).slice(2,6),
                   lat:tmpLatLng.lat, lng:tmpLatLng.lng, ...data});
  }
  save(); close(); render();
};

document.getElementById('delBtn').onclick = ()=>{
  const s = stations.find(x=>x.id===editId);
  if(confirm(`למחוק את "${s.name}"?\nאי אפשר לבטל.`)){
    stations = stations.filter(x=>x.id!==editId);
    save(); close(); render();
  }
};

document.getElementById('cancelBtn').onclick = close;
document.getElementById('modal').onclick = e=>{ if(e.target.id==='modal') close(); };
function close(){ document.getElementById('modal').classList.remove('open'); editId=null; }

/* ---------- "נבדק היום" ---------- */
window.checkNow = id=>{
  const s = stations.find(x=>x.id===id);
  s.last = today(); s.next = addYear(today());
  if(s.status !== 'missing') s.status = 'ok';
  save(); render();
  markers[id]?.openPopup();
};

/* ---------- מיקום נוכחי ---------- */
document.getElementById('locBtn').onclick = ()=>{
  if(!navigator.geolocation) return alert('אין תמיכה באיתור מיקום בדפדפן הזה.');
  navigator.geolocation.getCurrentPosition(
    p=>{
      const ll = [p.coords.latitude, p.coords.longitude];
      map.flyTo(ll, 19);
      L.circleMarker(ll,{radius:7,color:'#1668d9',fillColor:'#1668d9',fillOpacity:.9})
        .addTo(map).bindPopup('אתם כאן').openPopup();
    },
    ()=>alert('לא הצלחתי לאתר את המיקום. צריך לאשר הרשאת מיקום.'),
    {enableHighAccuracy:true}
  );
};

/* ---------- גיבוי / טעינה / דוח ---------- */
document.getElementById('expBtn').onclick = ()=>{
  const blob = new Blob([JSON.stringify(stations,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `עמדות-כיבוי-גשר-${today()}.json`;
  a.click();
};

document.getElementById('impBtn').onclick = ()=> document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      if(!Array.isArray(data)) throw 0;
      if(stations.length && !confirm('הטעינה תחליף את כל העמדות הקיימות. להמשיך?')) return;
      stations = data; save(); render(); fit();
    }catch(err){ alert('הקובץ לא תקין.'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

document.getElementById('prnBtn').onclick = ()=>{
  const rows = visible().map(s=>{
    const st = state(s);
    return `<tr><td>${esc(s.name)}</td><td>${esc(s.building)}</td><td>${esc(s.type)}</td>
      <td>${NAMES[st]}</td><td>${fmt(s.last)}</td><td>${fmt(s.next)}</td><td>${esc(s.notes)}</td></tr>`;
  }).join('');
  document.getElementById('printArea').innerHTML = `
    <h2>דוח עמדות כיבוי אש — קיבוץ גשר · ${fmt(today())}</h2>
    <table><tr><th>עמדה</th><th>מבנה</th><th>סוג</th><th>מצב</th>
    <th>בדיקה אחרונה</th><th>בדיקה הבאה</th><th>הערות</th></tr>${rows}</table>`;
  window.print();
};

/* ---------- שונות ---------- */
document.getElementById('search').oninput = render;
document.getElementById('sort').onchange  = render;
document.getElementById('mobBtn').onclick = ()=>
  document.getElementById('side').classList.toggle('open');
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape'){
    close();
    placing = false;
    document.getElementById('hint').classList.remove('show');
    map.getContainer().style.cursor = '';
  }
});

function fit(){
  if(stations.length){
    map.fitBounds(L.latLngBounds(stations.map(s=>[s.lat,s.lng])).pad(.25), {maxZoom:19});
  }
}

render(); fit();
</script>
</body>
</html>
